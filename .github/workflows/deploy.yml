name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate Render deploy hook secret
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL GitHub secret is not set."
            echo "Add it under: GitHub Repo > Settings > Secrets and variables > Actions"
            exit 1
          fi

          # Handle accidental copy/paste mistakes without printing the secret.
          HOOK_URL="$(printf '%s' "$RENDER_DEPLOY_HOOK_URL" | tr -d '\r\n' | xargs)"

          if [ -z "$HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is empty after trimming whitespace."
            exit 1
          fi

          if [[ ! "$HOOK_URL" =~ ^https://api\.render\.com/deploy/srv-[A-Za-z0-9]+\?key=[A-Za-z0-9._~-]+$ ]]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL appears malformed."
            echo "Expected format: https://api.render.com/deploy/srv-<service-id>?key=<deploy-key>"
            exit 1
          fi

          echo "Render deploy hook secret looks valid."

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          HOOK_URL="$(printf '%s' "$RENDER_DEPLOY_HOOK_URL" | tr -d '\r\n' | xargs)"

          echo "Triggering Render deploy..."
          http_code="$(curl --silent --show-error --output /tmp/render-deploy-response.txt --write-out '%{http_code}' -X POST "$HOOK_URL")"

          if [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Render deploy hook triggered successfully (HTTP $http_code)."
            exit 0
          fi

          echo "::error::Render deploy hook request failed with HTTP $http_code."
          if [ -s /tmp/render-deploy-response.txt ]; then
            echo "Response body (first 500 bytes):"
            head -c 500 /tmp/render-deploy-response.txt
            echo
          else
            echo "Response body was empty."
          fi
          exit 1
