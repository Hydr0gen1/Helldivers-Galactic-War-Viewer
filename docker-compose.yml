services:
  helldivers-intel:
    build:
      context: .
      dockerfile: Dockerfile
    image: helldivers-intel:local
    ports:
      - "8080:8080"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      HELLDIVERS_USER_AGENT: ${HELLDIVERS_USER_AGENT:-helldivers-intel/1.0 (docker-compose)}
      NODE_ENV: production
      PORT: 8080
      POLL_INTERVAL_MS: 60000
      ANALYZER_INTERVAL_MS: 300000
