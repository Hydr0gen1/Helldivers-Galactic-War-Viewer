services:
  helldivers-intel:
    build:
      context: .
      dockerfile: Dockerfile
    image: helldivers-intel:local
    ports:
      - "8080:8080"
    restart: unless-stopped
    env_file:
      - .env
      - .secrets.env
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      FIREWORKS_MODEL: ${FIREWORKS_MODEL:-}
      FIREWORKS_BASE_URL: ${FIREWORKS_BASE_URL:-https://api.fireworks.ai/inference/v1}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-llama-4-scout-17b-16e-instruct}
      HELLDIVERS_USER_AGENT: ${HELLDIVERS_USER_AGENT:-helldivers-intel/1.0 (docker-compose)}
      NODE_ENV: production
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POLL_INTERVAL_MS: 60000
      ANALYZER_INTERVAL_MS: 300000
      ANALYZER_MAX_TOKENS: ${ANALYZER_MAX_TOKENS:-600}
      ANALYZER_TIMEOUT_MS: ${ANALYZER_TIMEOUT_MS:-20000}
      HELLDIVERS_API_BASE: ${HELLDIVERS_API_BASE:-https://api.helldivers2.dev/api/v1}
      HELLDIVERS_MIN_REQUEST_GAP_MS: ${HELLDIVERS_MIN_REQUEST_GAP_MS:-10000}
      WAR_CHRONICLE_ENABLED: ${WAR_CHRONICLE_ENABLED:-true}
      WAR_CHRONICLE_DB_PATH: ${WAR_CHRONICLE_DB_PATH:-/app/data/helldivers-intel.sqlite}
      WAR_CHRONICLE_RETENTION_DAYS: ${WAR_CHRONICLE_RETENTION_DAYS:-30}
    volumes:
      - helldivers-data:/app/data

volumes:
  helldivers-data:
