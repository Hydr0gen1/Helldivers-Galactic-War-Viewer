services:
  helldivers-intel:
    build:
      context: .
      dockerfile: Dockerfile
    image: helldivers-intel:local
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      FIREWORKS_MODEL: ${FIREWORKS_MODEL:-accounts/fireworks/models/deepseek-v3p1}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-llama-4-scout-17b-16e-instruct}
      HELLDIVERS_USER_AGENT: ${HELLDIVERS_USER_AGENT:-helldivers-intel/1.0 (docker-compose)}
      NODE_ENV: production
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POLL_INTERVAL_MS: 60000
      ANALYZER_INTERVAL_MS: 300000
      ANALYZER_MAX_TOKENS: ${ANALYZER_MAX_TOKENS:-2000}
      ANALYZER_TIMEOUT_MS: ${ANALYZER_TIMEOUT_MS:-30000}
      HELLDIVERS_API_BASE: ${HELLDIVERS_API_BASE:-https://api.helldivers2.dev/api/v1}
      HELLDIVERS_MIN_REQUEST_GAP_MS: ${HELLDIVERS_MIN_REQUEST_GAP_MS:-250}
